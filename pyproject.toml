[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytalbum"
version = "0.1.0"
description = "Download albums from YouTube by name using yt-dlp"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Narla7" }]
keywords = ["youtube", "yt-dlp", "music", "album", "download", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.scripts]
ytalbum = "ytalbum:main"

[project.urls]
Homepage = "https://github.com/Narla7/youtube-album-downloader"
Repository = "https://github.com/Narla7/youtube-album-downloader"

[tool.setuptools]
py-modules = ["ytalbum"]
